<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pago | VentaNexIA</title><style>body{font-family:Inter,system-ui,Arial,sans-serif;background:#0b1220;color:#eef3f7;margin:0}.wrap{width:min(760px,92%);margin:48px auto}.card{background:#121c2b;border:1px solid #2b4057;border-radius:18px;padding:28px}.btn{display:inline-flex;border:0;border-radius:10px;padding:13px 18px;background:linear-gradient(90deg,#21c1f3,#8140ff);color:#fff;font-weight:900;cursor:pointer}.muted{color:#9fb0bf;font-size:13px;line-height:1.5}.summary{background:#0d1825;border:1px solid #38516b;border-radius:14px;padding:16px;margin:18px 0}.error{display:none;background:#351b1b;border:1px solid #784343;color:#ffd5d5;padding:12px;border-radius:10px;margin-top:14px}</style></head><body><main class="wrap"><div class="card"><h1>Revisa y paga tu plan</h1><p class="muted">El pago solo puede continuar si has aceptado previamente el contrato asociado a esta configuración.</p><div class="summary" id="summary"></div><button class="btn" id="payBtn" type="button">Pagar ahora →</button><div class="error" id="error"></div><p class="muted">El proveedor de pago abrirá un entorno seguro. Si la configuración cambia, deberá aceptarse de nuevo el contrato correspondiente.</p></div></main><script>const qs=new URLSearchParams(location.search);const plan=qs.get('plan')||'';const included=qs.get('included')||'';const extras=qs.get('extras')||'';const total=qs.get('total')||'';const email=qs.get('email')||'';document.getElementById('summary').textContent=`Plan: ${plan||'—'} · Incluidos: ${included||'—'} · Extras: ${extras||'—'} · Total: ${total?total+' €/mes + IVA':'—'}`;function fail(m){const e=document.getElementById('error');e.textContent=m;e.style.display='block'}document.getElementById('payBtn').addEventListener('click',async()=>{let acceptance=null;try{acceptance=JSON.parse(localStorage.getItem('vnx_contract_acceptance')||'null')}catch(e){}if(!acceptance||acceptance.plan!==plan||String(acceptance.total)!==String(total)){fail('Debes aceptar el contrato correspondiente a esta configuración antes de pagar.');return;}const b=document.getElementById('payBtn');b.disabled=true;b.textContent='Preparando pago…';try{const r=await fetch('/api/router?endpoint=create-checkout',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({plan,included:included.split(',').filter(Boolean),extras:extras.split(',').filter(Boolean),total:Number(total||0),email,contractAcceptance:acceptance})});const data=await r.json();if(!r.ok||!data?.url)throw new Error(data?.error||'No se pudo iniciar el pago');location.href=data.url;}catch(err){fail(err.message||'No se pudo iniciar el pago');b.disabled=false;b.textContent='Pagar ahora →';}});</script></body></html>
