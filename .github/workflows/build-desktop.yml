name: Build VentaNexIA Desktop

on:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - '.github/workflows/build-desktop.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    env:
      VNX_BUILD_EDITION: master
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: node smoke-renderer.cjs
      - run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: VentaNexIA-Desktop-Windows-MASTER
          path: desktop/dist/*.exe
          if-no-files-found: error
          retention-days: 14
