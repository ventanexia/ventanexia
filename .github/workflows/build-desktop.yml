name: Build VentaNexIA Desktop

on:
  push:
    branches: [main, 'release/desktop-0.6.80']
    paths:
      - 'desktop/**'
      - '.github/workflows/build-desktop.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    env:
      VNX_BUILD_EDITION: master
      CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - name: Verify release target
        run: echo Building VentaNexIA $env:VNX_BUILD_EDITION
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: node smoke-renderer.cjs
      - run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: VentaNexIA-Desktop-Windows-MASTER
          path: desktop/dist/*.exe
          if-no-files-found: error
          retention-days: 14
