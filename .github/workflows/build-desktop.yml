name: Build VentaNexIA Desktop

on:
  push:
    branches: [main, release/0.6.158-production-hardening]
    paths:
      - 'desktop/**'
      - 'app/**'
      - 'index.html'
      - 'planes.html'
      - 'constructor.html'
      - 'contrato-servicio.html'
      - 'checkout.html'
      - 'assets/builder.js'
      - 'config/pricing.json'
      - 'config/ai-routing.json'
      - 'config/agents.json'
      - 'lib/jev-client.js'
      - 'server/handlers/qualify.js'
      - 'server/handlers/lead.js'
      - 'lib/lead-qualification.js'
      - 'server/handlers/oauth-common.js'
      - 'server/handlers/oauth-callback.js'
      - 'server/lib/whatsapp-core.js'
      - 'lib/pricing.js'
      - 'server/handlers/start-trial.js'
      - 'server/handlers/create-checkout.js'
      - 'api/router.js'
      - 'sitemap.xml'
      - 'robots.txt'
      - 'vercel.json'
      - '.github/workflows/build-desktop.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    env:
      VNX_BUILD_EDITION: master
      CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - name: Verify release target
        run: echo Building VentaNexIA $env:VNX_BUILD_EDITION
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Verify 0.6.158 hardening sources
        shell: pwsh
        run: |
          if (-not (Test-Path runtime-diagnostics.cjs)) { throw 'runtime-diagnostics.cjs missing' }
          if (-not (Test-Path updater.cjs)) { throw 'updater.cjs missing' }
          if (-not (Select-String -Path master-entry.cjs -Pattern 'requestSingleInstanceLock' -Quiet)) { throw 'single instance guard missing' }
          if (-not (Select-String -Path state-store.cjs -Pattern 'SECURE_STORAGE_UNAVAILABLE' -Quiet)) { throw 'secure storage fail-closed guard missing' }
          $pkg = Get-Content package.json | ConvertFrom-Json
          if ($pkg.version -ne '0.6.158') { throw "Wrong version: $($pkg.version)" }
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high
      - run: node smoke-renderer.cjs
      - run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: VentaNexIA-Desktop-Windows-MASTER
          path: desktop/dist/*.exe
          if-no-files-found: error
          retention-days: 14

