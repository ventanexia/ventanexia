name: Verify VentaNexIA Commercial Model

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'planes.html'
      - 'contrato-servicio.html'
      - 'checkout.html'
      - 'server/handlers/contract-accept.js'
      - 'server/handlers/create-checkout.js'
      - 'docs/paid-plan-operating-model.md'
      - 'server/handlers/start-trial.js'
      - 'server/handlers/trial-sweep.js'
      - 'server/handlers/portal-state.js'
      - 'assets/portal.js'
      - 'assets/builder.js'
      - 'lib/entitlement.js'
      - 'condiciones-prueba.html'
      - '.github/workflows/verify-commercial-model.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check server syntax
        run: |
          node --check server/handlers/contract-accept.js
          node --check server/handlers/create-checkout.js
          node --check server/handlers/start-trial.js
          node --check server/handlers/trial-sweep.js
          node --check server/handlers/portal-state.js
          node --check assets/portal.js
          node --check assets/builder.js
          node --check lib/entitlement.js
      - name: Verify commercial model and inline scripts
        run: |
          node <<'NODE'
          const fs=require('fs');
          const vm=require('vm');
          const read=p=>fs.readFileSync(p,'utf8');
          const plans=read('planes.html');
          const contract=read('contrato-servicio.html');
          const checkout=read('checkout.html');
          const home=read('index.html');
          const accept=read('server/handlers/contract-accept.js');
          const pay=read('server/handlers/create-checkout.js');
          const docs=read('docs/paid-plan-operating-model.md');
          const trial=read('lib/entitlement.js');
          const sweep=read('server/handlers/trial-sweep.js');
          const portal=read('assets/portal.js');
          function must(ok,msg){if(!ok)throw new Error(msg)}
          function checkInlineScripts(html,name){
            for(const m of html.matchAll(/<script(?![^>]*type=["']application\/ld\+json["'])[^>]*>([\s\S]*?)<\/script>/gi)){
              const src=m[1].trim(); if(!src)continue;
              new vm.Script(src,{filename:name});
            }
          }
          checkInlineScripts(plans,'planes-inline.js');
          checkInlineScripts(contract,'contract-inline.js');
          checkInlineScripts(checkout,'checkout-inline.js');

          must(plans.includes("price:99")&&plans.includes("price:249")&&plans.includes("price:499"),'Launch plan prices mismatch');
          must(plans.includes("listPrice:129")&&plans.includes("listPrice:299")&&plans.includes("listPrice:599"),'Normal plan prices mismatch');
          must(plans.includes("workUnits:1500")&&plans.includes("workUnits:5000")&&plans.includes("workUnits:12000"),'Monthly work capacities mismatch');
          must(plans.includes("Todos los asistentes estándar incluidos")&&plans.includes("Carla coordina"),'All-assistants commercial promise missing');
          must(plans.includes("capacity_pack")&&plans.includes("price:49"),'Capacity pack missing');
          must(plans.includes("voice_pack")&&plans.includes("whatsapp_pack")&&plans.includes("video_pack"),'Variable-cost packs missing');
          must(home.includes('99 €')&&home.includes('249 €')&&home.includes('499 €'),'Home launch pricing stale');
          must(home.includes('VNX Negocio')&&home.includes('Todos los asistentes estándar incluidos'),'Home positioning stale');
          must(contract.includes("termAck")&&contract.includes("capacidad")&&contract.includes("49 €/mes"),'Customer contract capacity/term model missing');
          must(accept.includes('price:99')&&accept.includes('price:249')&&accept.includes('price:499'),'Contract server launch prices mismatch');
          must(accept.includes('workUnits:1500')&&accept.includes('workUnits:5000')&&accept.includes('workUnits:12000'),'Contract server work capacities mismatch');
          must(accept.includes('b.termAcknowledged!==true'),'Contract term acknowledgement not enforced');
          must(pay.includes('expectedAmount:9900')&&pay.includes('expectedAmount:24900')&&pay.includes('expectedAmount:49900'),'Stripe checkout expected prices mismatch');
          must(pay.includes('2.000 trabajos adicionales al mes')&&pay.includes('Conexión o cuenta adicional'),'Stripe checkout add-ons mismatch');
          must(checkout.includes('Todos los asistentes estándar incluidos')&&checkout.includes('Capacidad:'),'Final checkout summary missing capacity model');
          must(docs.includes('99 €/mes')&&docs.includes('249 €/mes')&&docs.includes('499 €/mes'),'Operating docs pricing stale');
          must(trial.includes('TRIAL_DAYS=15'),'Trial duration must be 15 days');
          must(plans.includes('15 DÍAS GRATIS')&&plans.includes('sin tarjeta'),'Plans must explain no-card trial');
          must(sweep.includes('trial_expiring_reminder')&&sweep.includes('trial_expired_email'),'Trial lifecycle emails missing');
          must(portal.includes('trialExpiredBanner')&&portal.includes('15 días'),'Expired trial continuation UI missing');
          const startTrial=read('server/handlers/start-trial.js');
          const builder=read('assets/builder.js');
          const terms=read('condiciones-prueba.html');
          must(startTrial.includes('createCustomerCode')&&startTrial.includes('createActivationCode')&&startTrial.includes('trialTermsAccepted'),'Trial registration/licence automation missing');
          must(builder.includes('trialTermsAck')&&builder.includes('trialNoChargeAck'),'Trial acceptance checkboxes missing');
          must(terms.includes('no cedible')&&terms.includes('no transferible')&&terms.includes('15 días gratis'),'Trial terms missing licence restrictions');
          must(terms.includes('secretos empresariales')&&terms.includes('Prohibición de copia')&&terms.includes('interoperabilidad'),'Trial anti-copy/confidentiality clauses missing');
          must(contract.includes('16 bis. Confidencialidad')&&contract.includes('ipAck'),'Paid contract anti-copy/confidentiality acceptance missing');
          must(accept.includes('ipConfidentialityAccepted')&&accept.includes('2026-09-20-v10'),'Server must enforce IP/confidentiality acceptance');
          console.log('VentaNexIA commercial model verification OK: launch prices, full standard team, capacity model, contract term and checkout synchronized.');
          NODE
