name: Verify VentaNexIA Commercial Model

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'planes.html'
      - 'descargar.html'
      - 'constructor.html'
      - 'vercel.json'
      - 'contrato-servicio.html'
      - 'checkout.html'
      - 'server/handlers/contract-accept.js'
      - 'server/handlers/create-checkout.js'
      - 'docs/paid-plan-operating-model.md'
      - 'server/handlers/start-trial.js'
      - 'server/handlers/trial-sweep.js'
      - 'server/handlers/portal-state.js'
      - 'assets/portal.js'
      - 'assets/builder.js'
      - 'lib/entitlement.js'
      - 'condiciones-prueba.html'
      - '.github/workflows/verify-commercial-model.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check server syntax
        run: |
          node --check server/handlers/contract-accept.js
          node --check server/handlers/create-checkout.js
          node --check server/handlers/start-trial.js
          node --check server/handlers/trial-sweep.js
          node --check server/handlers/portal-state.js
          node --check assets/portal.js
          node --check assets/builder.js
          node --check lib/entitlement.js
      - name: Verify commercial model and inline scripts
        run: |
          node <<'NODE'
          const fs=require('fs');
          const vm=require('vm');
          const read=p=>fs.readFileSync(p,'utf8');
          const plans=read('planes.html');
          const contract=read('contrato-servicio.html');
          const checkout=read('checkout.html');
          const home=read('index.html');
          const accept=read('server/handlers/contract-accept.js');
          const pay=read('server/handlers/create-checkout.js');
          const docs=read('docs/paid-plan-operating-model.md');
          const trial=read('lib/entitlement.js');
          const desktopVersion=JSON.parse(read('desktop/package.json')).version;
          const sweep=read('server/handlers/trial-sweep.js');
          const portal=read('assets/portal.js');
          function must(ok,msg){if(!ok)throw new Error(msg)}
          function checkInlineScripts(html,name){
            for(const m of html.matchAll(/<script(?![^>]*type=["']application\/ld\+json["'])[^>]*>([\s\S]*?)<\/script>/gi)){
              const src=m[1].trim(); if(!src)continue;
              new vm.Script(src,{filename:name});
            }
          }
          checkInlineScripts(plans,'planes-inline.js');
          checkInlineScripts(contract,'contract-inline.js');
          checkInlineScripts(checkout,'checkout-inline.js');

          must(plans.includes("price:129")&&plans.includes("price:299")&&plans.includes("price:599"),'Plan prices mismatch');
          must(plans.includes("listPrice:129")&&plans.includes("listPrice:299")&&plans.includes("listPrice:599"),'Public reference prices must match current prices');
          must(!plans.includes("workUnits:1500")&&!plans.includes("workUnits:5000")&&!plans.includes("workUnits:12000"),'Obsolete global work capacities still exposed');
          must(plans.includes("Todos los asistentes estándar incluidos")&&plans.includes("Carla coordina"),'All-assistants commercial promise missing');
          must(plans.includes("email_account")&&plans.includes("storage_pack")&&plans.includes("order_pack")&&plans.includes("video_pack")&&plans.includes("voice_pack"),'Current public add-ons missing');
          must(!plans.includes("capacity_pack"),'Obsolete capacity pack must stay hidden');
          must(plans.includes("/constructor.html?plan=")&&plans.includes("Empezar demo completa 15 días"),'Trial cart must lead to active trial flow');
          must(home.includes('129 €')&&home.includes('299 €')&&home.includes('599 €'),'Home pricing stale');
          must(home.includes('VNX Negocio')&&home.includes('Todos los asistentes estándar incluidos'),'Home positioning stale');
          must(home.includes('VENTANEXIA DESKTOP '+desktopVersion)&&home.includes('15 días gratis sin tarjeta'),'Home must state current desktop '+desktopVersion+' and trial availability');
          must(contract.includes("termAck")&&contract.includes("límites medidos")&&contract.includes("49 €/mes"),'Customer contract limits/term model missing');
          must(!contract.includes("workUnits={inicio:1500")&&!contract.includes("trabajos/mes · Conexiones"),'Customer contract still exposes obsolete global work units');
          must(accept.includes('price:129')&&accept.includes('price:299')&&accept.includes('price:599'),'Contract server prices mismatch');
          must(!accept.includes('workUnits:1500')&&!accept.includes('workUnits:5000')&&!accept.includes('workUnits:12000'),'Signed contract still contains obsolete work-unit promises');
          must(accept.includes('b.termAcknowledged!==true'),'Contract term acknowledgement not enforced');
          must(pay.includes('expectedAmount:12900')&&pay.includes('expectedAmount:29900')&&pay.includes('expectedAmount:59900'),'Stripe checkout expected prices mismatch');
          must(pay.includes('Conexión o cuenta adicional')&&!pay.includes('2.000 trabajos adicionales al mes'),'Stripe checkout recurring add-ons mismatch');
          must(checkout.includes('Todos los asistentes estándar incluidos')&&!checkout.includes('trabajos/mes'),'Final checkout summary must use measurable limits only');
          must(docs.includes('129 €/mes')&&docs.includes('299 €/mes')&&docs.includes('599 €/mes'),'Operating docs pricing stale');
          must(docs.includes('No se publica una cifra genérica de «trabajos al mes»'),'Operating docs must explain removal of global work-unit promise');
          must(trial.includes('TRIAL_DAYS=15'),'Trial duration must be 15 days');
          must(plans.includes('15 DÍAS GRATIS')&&plans.includes('sin tarjeta'),'Plans must explain no-card trial');
          must(sweep.includes('trial_expiring_reminder')&&sweep.includes('trial_expired_email'),'Trial lifecycle emails missing');
          must(portal.includes('trialExpiredBanner')&&portal.includes('15 días'),'Expired trial continuation UI missing');
          const startTrial=read('server/handlers/start-trial.js');
          const builder=read('assets/builder.js');
          const terms=read('condiciones-prueba.html');
          const download=read('descargar.html');
          const constructor=read('constructor.html');
          must(startTrial.includes('createCustomerCode')&&startTrial.includes('createActivationCode')&&startTrial.includes('trialTermsAccepted'),'Trial registration/licence automation missing');
          must(builder.includes('/api/start-trial')&&builder.includes('trialTermsAccepted:true'),'Public builder must activate the controlled trial flow');
          must(download.includes('15 días gratis y sin tarjeta')&&download.includes('Activar mis 15 días gratis'),'Download page must expose active trial flow');
          must(!constructor.includes('vnxLegacyTrialRedirect')&&constructor.includes('Activar mis 15 días gratis'),'Constructor must expose active trial activation');
          must(terms.includes('no cedible')&&terms.includes('no transferible')&&terms.includes('15 días de demo completa, gratis'),'Trial terms missing licence restrictions');
          must(terms.includes('secretos empresariales')&&terms.includes('Prohibición de copia')&&terms.includes('interoperabilidad'),'Trial anti-copy/confidentiality clauses missing');
          must(contract.includes('16 bis. Confidencialidad')&&contract.includes('ipAck'),'Paid contract anti-copy/confidentiality acceptance missing');
          must(accept.includes('ipConfidentialityAccepted')&&accept.includes('2026-09-23-v13'),'Server must enforce current IP/confidentiality acceptance');
          console.log('VentaNexIA commercial model verification OK: current prices, measurable limits, active no-card trial and contracts synchronized.');
          NODE
